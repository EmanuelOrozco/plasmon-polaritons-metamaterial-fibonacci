# Figura 6 — anchos de banda vs ángulo
# [AMB] el paper no reitera parámetros; se infieren de Figs. 3–5.
# [AMB] m = 2..7 inferido del layout de 6 paneles.
layer_a_thickness_mm: 12.0
layer_b_thickness_mm: 12.0
epsilon_a: 1.0
mu_a: 1.0
epsilon_0: 1.0
mu_0: 1.0
omega_e_over_2pi_ghz: 3.0
omega_m_over_2pi_ghz: 1.0
speed_of_light: si
source: inferred_from_figures_3_to_5
polarization: TE
fibonacci_orders: [2, 3, 4, 5, 6, 7]
theta_min_rad: 0.0
theta_max_rad: 1.0471975511965976
theta_points: 41
plasmon_window_ghz: [0.90, 1.02]
# Malla = logarítmica en (nu_m - nu) + uniforme fina. Cerca de theta = 0 las
# subbandas quedan a ~1e-5 GHz de nu_m con anchos de ~5e-8 GHz, y a theta ~ pi/12
# hay gaps físicos de ~4e-7 GHz; una malla uniforme gruesa no los resuelve.
frequency_points_log: 60000
frequency_points_uniform: 250000
frequency_uniform_min_ghz: 0.95
nu_m_min_offset_ghz: 1.0e-10
notes:
  - "IMPL: mismos a, b, omega_e, omega_m que Figs. 3-5"
  - "IMPL: m = 2..7; el caption de Fig. 6 está truncado"
  - "bandwidth = nu_max - nu_min de cada subbanda conexa"
